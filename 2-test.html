<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Jumping — Ubernatural</title>
<style>
@font-face{font-family:'SF Pro';font-style:normal;font-weight:400;font-display:swap;src:local('SF Pro Text'),local('SFProText-Regular'),local('SF Pro');}
@font-face{font-family:'SF Pro';font-style:normal;font-weight:700;font-display:swap;src:local('SF Pro Text Bold'),local('SFProText-Bold'),local('SF Pro Bold');}
@font-face{font-family:'SF Pro Thin';font-style:normal;font-weight:100;font-display:swap;src:local('SF Pro Thin'),local('SFProText-Thin'),local('SFPro-Thin');}
@font-face{font-family:'Aalto';font-style:normal;font-weight:400;font-display:swap;src:local('Aalto'),local('Aalto Regular');}
:root{font-family:'SF Pro',Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
html,body,button,a,.portal{cursor:none!important}
.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease}
.background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}
.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);display:flex;justify-content:space-between;align-items:center}
.header-actions{margin-left:auto;display:flex;align-items:center}
.nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px}
.nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1}
.nav a.active{background:#fff;color:#000}
.menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;cursor:pointer;font-family:inherit;font-size:15px}
.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
.planet-item{display:flex;align-items:center;min-height:20px}
.planet-item.active{font-size:18px;font-weight:700;gap:8px}
.planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}
.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
.portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
.portal-heading strong{font-size:18px;margin-left:8px}
.portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important}
.portal:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:8px}
.portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
.portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}
.planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.planet-content h1{font-family:Aalto,'Arial Narrow','HelveticaNeue-CondensedBold','Roboto Condensed',sans-serif-condensed,sans-serif;font-stretch:condensed;font-size:clamp(128px,21.8vw,314px);font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(-32px);opacity:0}
.planet-content dl{width:min(447px,34vw);flex:none;margin:0;font-size:16px}
.fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
.fact:last-child{border-bottom:0}
.fact dt{font-weight:700}
.fact dd{margin:0}
.transition-layer{display:none}
.scene-canvas{display:none}
.loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
.experience.is-loading .loading{opacity:.8}
.experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
.experience.is-transitioning .shade{opacity:1}
.experience.is-committing .background{transition:none!important}
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-background{z-index:0}
.preloader.is-background .preloader-shade{opacity:0}
.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);will-change:left,top,width,height,transform;transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
.floating-logo.is-settled{z-index:5}
.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1}
.preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}
.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
.cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}
body:not(.intro-ready) .header,body:not(.intro-ready) .planet-list,body:not(.intro-ready) .planet-content h1,body:not(.intro-ready) .planet-content .fact{opacity:0}
.intro-ready .header{animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both}
.intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
.content-revealing h1{animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both}
.content-revealing .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
.content-revealing .fact:nth-child(1){animation-delay:.52s}
.content-revealing .fact:nth-child(2){animation-delay:.68s}
.content-revealing .fact:nth-child(3){animation-delay:.84s}
.content-revealing .fact:nth-child(4){animation-delay:1s}
.mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}
.planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}
.planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}
.planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}
.planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}
.planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}
.planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}
.planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
.planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}
@keyframes reveal-down{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes title-rise{from{opacity:0;filter:blur(12px);transform:translate(-32px,42px)}to{opacity:1;filter:blur(0);transform:translate(-32px,0)}}
@keyframes fact-rise{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes active-dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@media(max-width:900px){
  .nav{display:none}
  .portal-wrap{width:min(300px,48vw)}
  .planet-content h1{font-size:clamp(105px,24vw,190px)}
  .planet-content dl{width:43vw}
  .fact{grid-template-columns:110px 1fr}
  .planet-list{font-size:14px}
  .planet-item.active{font-size:16px}
}
@media(max-width:640px){
  .experience{min-height:600px}
  .planet-list{display:none}
  .portal-wrap{top:44%;width:min(260px,66vw)}
  .planet-content{left:18px;right:18px;bottom:18px;display:block}
  .planet-content h1{font-size:clamp(98px,30vw,160px);margin-bottom:20px}
  .planet-content dl{width:100%;font-size:13px}
  .fact{grid-template-columns:92px 1fr;padding:5px 0}
  .portal-heading{font-size:14px}
  .portal-heading strong{font-size:16px}
  .menu{height:38px}
  .portal{border-radius:70px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.portal{transform:none!important}}
</style>
</head>

</main>
<script>

var current = 'mars';
var busy = false;
var hasRendered = false;


var experience      = document.querySelector('.experience');
var portal          = document.getElementById('portal');

var sceneBg         = document.getElementById('scene-background');
var ctx  = portalCanvas.getContext('2d');
var sctx = sceneCanvasEl.getContext('2d');
var bctx = sceneBg.getContext('2d');

var rotX = 0, rotY = 0, targetX = 0, targetY = 0;
var expansion = 0, maskScale = 0, canvasOpacity = 1;

/* ---- Procedural planet scenes (fallback for planets without supplied footage) ---- */
var sceneCanvases = {};
var starFields = {};
var PALETTES = {
  mercury: { light:'#9b8f80', base:'#6f665c', dark:'#3a352e', bands:false, spot:false, rings:false },
  jupiter: { light:'#ecd7b8', base:'#c9a171', dark:'#7d5c3c', bands:true,  spot:true,  rings:false },
  saturn:  { light:'#f2e3bd', base:'#e0c796', dark:'#9c814d', bands:true,  spot:false, rings:true  },
  uranus:  { light:'#c9edf0', base:'#9fd8dd', dark:'#4f8e9b', bands:false, spot:false, rings:false },
  neptune: { light:'#6f8fe8', base:'#3b5bd0', dark:'#1b2c72', bands:true,  spot:false, rings:false }
};
function makeStars(key){
  var seed = 7;
  for (var i = 0; i < key.length; i++) seed = (seed * 31 + key.charCodeAt(i)) & 0x7fffffff;
  function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  var s = [];
  for (var i = 0; i < 150; i++) s.push([rnd(), rnd(), rnd() * .8 + .35, rnd() * 6.28]);
  return s;
}
function sceneCanvasFor(key){
  if (!sceneCanvases[key]){
    var c = document.createElement('canvas');
    c.width = 1280; c.height = 720;
    sceneCanvases[key] = c;
    starFields[key] = makeStars(key);
  }
  return sceneCanvases[key];
}
function renderScene(key, t){
  var c = sceneCanvasFor(key), g = c.getContext('2d'), W = c.width, H = c.height;
  var p = PALETTES[key];
  var bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#07070c'); bg.addColorStop(1, '#030305');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  var stars = starFields[key];
  for (var i = 0; i < stars.length; i++){
    var st = stars[i];
    g.globalAlpha = st[2] * (.55 + .45 * Math.sin(t * .001 + st[3]));
    g.fillStyle = '#fff';
    g.fillRect(st[0] * W, st[1] * H, 1.6, 1.6);
  }
  g.globalAlpha = 1;
  var cx = W * .5 + Math.sin(t * .0002) * 12, cy = H * .52, R = H * .60;
  if (p.rings){
    g.save(); g.translate(cx, cy); g.rotate(-.35);
    for (var r = 0; r < 3; r++){
      g.globalAlpha = .42 - r * .1; g.strokeStyle = r % 2 ? '#d9c693' : '#b39c6b'; g.lineWidth = 9 - r * 2.5;
      g.beginPath(); g.ellipse(0, 0, R * 1.55 + r * 14, R * .42 + r * 5, 0, Math.PI, 2 * Math.PI); g.stroke();
    }
    g.restore(); g.globalAlpha = 1;
  }
  var glow = g.createRadialGradient(cx, cy, R * .9, cx, cy, R * 1.4);
  glow.addColorStop(0, 'rgba(255,255,255,.09)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = glow; g.beginPath(); g.arc(cx, cy, R * 1.4, 0, 7); g.fill();
  var grad = g.createRadialGradient(cx - R * .4, cy - R * .45, R * .1, cx, cy, R);
  grad.addColorStop(0, p.light); grad.addColorStop(.55, p.base); grad.addColorStop(1, p.dark);
  g.fillStyle = grad; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
  if (p.bands){
    g.save(); g.beginPath(); g.arc(cx, cy, R, 0, 7); g.clip();
    for (var b = 0; b < 7; b++){
      var y = cy - R + (b + .5) * (2 * R / 7);
      g.globalAlpha = .16; g.fillStyle = b % 2 ? p.dark : p.light;
      g.fillRect(cx - R + Math.sin(t * .0004 + b) * 6, y - R / 14, 2 * R, R / 7);
    }
    g.restore(); g.globalAlpha = 1;
  }
  if (p.spot){
    g.globalAlpha = .5; g.fillStyle = '#c65f3c';
    g.beginPath(); g.ellipse(cx + R * .3, cy + R * .25, R * .16, R * .09, 0, 0, 7); g.fill();
    g.globalAlpha = 1;
  }
  var sh = g.createRadialGradient(cx - R * .5, cy - R * .5, R * .3, cx, cy, R * 1.05);
  sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.55)');
  g.fillStyle = sh; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
  if (p.rings){
    g.save(); g.translate(cx, cy); g.rotate(-.35);
    for (var r = 0; r < 3; r++){
      g.globalAlpha = .55 - r * .12; g.strokeStyle = r % 2 ? '#e6d3a3' : '#c4ac7c'; g.lineWidth = 9 - r * 2.5;
      g.beginPath(); g.ellipse(0, 0, R * 1.55 + r * 14, R * .42 + r * 5, 0, 0, Math.PI); g.stroke();
    }
    g.restore(); g.globalAlpha = 1;
  }
}

function easeInOutCubic(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }

function animateValue(setter, duration){
  return new Promise(function(resolve){
    var start = performance.now();
    function step(now){
      var k = Math.min(1, (now - start) / duration);
      setter(easeInOutCubic(k));
      if (k < 1) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}

function resizeCanvas(){
  var d = Math.min(window.devicePixelRatio || 1, 2);
  portalCanvas.width = innerWidth * d;
  portalCanvas.height = innerHeight * d;
  portalCanvas.style.width = innerWidth + 'px';
  portalCanvas.style.height = innerHeight + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
  sceneBg.width = innerWidth * d;
  sceneBg.height = innerHeight * d;
  bctx.setTransform(d, 0, 0, d, 0, 0);
  if (!frozen){
    sceneCanvasEl.width = innerWidth * d;
    sceneCanvasEl.height = innerHeight * d;
    sctx.setTransform(d, 0, 0, d, 0, 0);
  }
}

function drawCover(c, media){
  var mw = media.videoWidth || media.naturalWidth || media.width;
  var mh = media.videoHeight || media.naturalHeight || media.height;
  if (!mw || !mh) return;
  var scale = Math.max(innerWidth / mw, innerHeight / mh);
  var w = mw * scale, h = mh * scale;
  c.drawImage(media, (innerWidth - w) / 2, (innerHeight - h) / 2, w, h);
}

function drawShade(c){
  var g = c.createLinearGradient(0, innerHeight * .52, 0, innerHeight);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.88)');
  c.fillStyle = g;
  c.fillRect(0, innerHeight * .52, innerWidth, innerHeight * .48);
}


function roundedRectPoints(w, h, r){
  var pts = [];
  var corners = [
    [ w/2 - r, -h/2 + r, -Math.PI/2, 0 ],
    [ w/2 - r,  h/2 - r, 0, Math.PI/2 ],
    [-w/2 + r,  h/2 - r, Math.PI/2, Math.PI ],
    [-w/2 + r, -h/2 + r, Math.PI, Math.PI * 1.5 ]
  ];
  for (var i = 0; i < corners.length; i++){
    var ccx = corners[i][0], ccy = corners[i][1], a0 = corners[i][2], a1 = corners[i][3];
    for (var s = 0; s <= 10; s++){
      var a = a0 + (a1 - a0) * (s / 10);
      pts.push([ccx + r * Math.cos(a), ccy + r * Math.sin(a)]);
    }
  }
  return pts;
}

function buildMaskPath(cx, cy, w, h, r, rx, ry){
  var ax = rx * Math.PI / 180, ay = ry * Math.PI / 180;
  var cosY = Math.cos(ay), sinY = Math.sin(ay);
  var cosX = Math.cos(ax), sinX = Math.sin(ax);
  var pts = roundedRectPoints(w, h, r);
  var path = new Path2D();
  for (var i = 0; i < pts.length; i++){
    var x = pts[i][0], y = pts[i][1];
    var xx = x * cosY;
    var yy = y * cosX;
    var z = x * sinY - y * sinX;
    var p = 850 / (850 + z);
    var sx = cx + xx * p, sy = cy + yy * p;
    if (i === 0) path.moveTo(sx, sy); else path.lineTo(sx, sy);
  }
  path.closePath();
  return path;
}

function portalMedia(state){
  var p = state.portal;
  if (!p) return sceneCanvasFor(current);
  if (p.type === 'video') return portalVideo;
  if (p.type === 'image') return portalImage;
  return sceneCanvasFor(p.key);
}

var lastFrame = performance.now();
function draw(now){
  requestAnimationFrame(draw);
  var dt = Math.min(40, now - lastFrame);
  lastFrame = now;
  rotX += (targetX - rotX) * Math.min(1, dt * .009);
  rotY += (targetY - rotY) * Math.min(1, dt * .009);

  var state = states[current];
  if (state.background.type === 'scene'){
    renderScene(state.background.key, now);
    drawCover(bctx, sceneCanvasFor(state.background.key));
  }

  ctx.clearRect(0, 0, innerWidth, innerHeight);
  if (frozen){
    ctx.drawImage(sceneCanvasEl, 0, 0, innerWidth, innerHeight);
    drawShade(ctx);
  }
  var rect = portal.getBoundingClientRect();
  var e = expansion;
  var rectCx = rect.left + rect.width / 2, rectCy = rect.top + rect.height / 2;
  var cx = rectCx + (innerWidth / 2 - rectCx) * e;
  var cy = rectCy + (innerHeight / 2 - rectCy) * e;
  var baseW = rect.width + (innerWidth - rect.width) * e;
  var baseH = rect.height + (innerHeight - rect.height) * e;
  var scale = e ? 1 : maskScale;
  var w = baseW * scale, h = baseH * scale;
  var r = Math.min(90 * (1 - e) * scale, w / 2, h / 2);
  var rx = rotX * (1 - e), ry = rotY * (1 - e);
  if (w > 1 && h > 1){
    var media;
    if (transitionActive) media = transitionMedia;
    else {
      media = portalMedia(state);
      if (state.portal && state.portal.type === 'scene') renderScene(state.portal.key, now);
      if (!state.portal) renderScene(current, now);
    }
    ctx.save();
    ctx.globalAlpha = canvasOpacity;
    ctx.clip(buildMaskPath(cx, cy, w, h, r, rx, ry));
    ctx.fillStyle = '#030303';
    ctx.fillRect(0, 0, innerWidth, innerHeight);
    drawCover(ctx, media);
    if (transitionActive) drawShade(ctx);
    ctx.restore();
  }
}

function render(){
  var state = states[current];
  experience.dataset.planet = current;
  document.getElementById('planet-title').textContent = state.name.toUpperCase();
  document.getElementById('next-name').textContent = state.next || 'Journey complete';
  document.getElementById('next-number').textContent = state.number;
  portal.setAttribute('aria-label', state.next ? 'Travel to ' + state.next : 'Journey complete');

  var factsHtml = '';
  for (var i = 0; i < state.facts.length; i++){
    factsHtml += '<div class="fact"><dt>' + state.facts[i][0] + '</dt><dd>' + state.facts[i][1] + '</dd></div>';
  }
  document.getElementById('facts').innerHTML = factsHtml;

  var listHtml = '';
  for (var p = 0; p < planets.length; p++){
    var isActive = planets[p].toLowerCase() === current;
    listHtml += '<span class="planet-item' + (isActive ? ' active' : '') + '" role="button" tabindex="0">' + planets[p] + '</span>';
  }
  var list = document.querySelector('.planet-list');
  list.innerHTML = listHtml;
  Array.prototype.forEach.call(list.children, function(el, idx){
    el.addEventListener('click', function(){ jumpTo(planets[idx].toLowerCase()); });
    el.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' || ev.key === ' ') jumpTo(planets[idx].toLowerCase()); });
  });
  if (hasRendered){
    list.classList.remove('is-switching');
    void list.offsetWidth;
    list.classList.add('is-switching');
  }
  hasRendered = true;

  var backgrounds = document.querySelectorAll('.background');
  var activeBgId = state.background.type === 'video' ? state.background.id : 'scene-background';
  for (var b = 0; b < backgrounds.length; b++){
    backgrounds[b].classList.toggle('is-visible', backgrounds[b].id === activeBgId);
  }

  var pm = state.portal;
  portalImage.style.visibility = pm && pm.type === 'image' ? 'visible' : 'hidden';
  portalVideo.style.visibility = pm && pm.type === 'video' ? 'visible' : 'hidden';
  if (pm && pm.type === 'video' && portalVideo.getAttribute('src') !== pm.src){
    portalVideo.src = pm.src;
    portalVideo.load();
  }
}

function jumpTo(key){
  if (busy || key === current || !states[key]) return;
  busy = true;
  current = key;
  experience.classList.remove('content-revealing', 'mask-revealing');
  render();
  var mr = revealMask();
  setTimeout(revealPlanetContent, 100);
  mr.then(function(){ busy = false; });
}


function waitEvent(el, name, timeout){
  return new Promise(function(resolve){
    var done = false;
    var to = setTimeout(finish, timeout);
    function finish(){
      if (done) return;
      done = true;
      clearTimeout(to);
      el.removeEventListener(name, finish);
      resolve();
    }
    el.addEventListener(name, finish);
  });
}

function whenLoadable(media){
  if (media.tagName === 'CANVAS') return Promise.resolve();
  if (media.tagName === 'IMG'){
    if (media.complete && media.naturalWidth) return Promise.resolve();
    return Promise.race([waitEvent(media, 'load', 4000), waitEvent(media, 'error', 4000)]);
  }
  if (media.readyState >= 2) return Promise.resolve();
  return Promise.race([
    waitEvent(media, 'canplay', 4000),
    waitEvent(media, 'canplaythrough', 4000),
    waitEvent(media, 'error', 4000)
  ]);
}

function revealMask(){
  experience.classList.remove('mask-revealing');
  void experience.offsetWidth;
  experience.classList.add('mask-revealing');
  maskScale = 0;
  return animateValue(function(v){ maskScale = v; }, 1050);
}

function revealPlanetContent(){
  experience.classList.remove('content-revealing');
  void experience.offsetWidth;
  experience.classList.add('content-revealing');
}

function startExperience(){
  var media = portalMedia(states[current]);
  whenLoadable(media)
    .then(function(){ return revealMask(); })
    .then(function(){
      document.body.classList.add('intro-ready');
      setTimeout(revealPlanetContent, 850);
    });
}

function runPreloader(){
  var video = document.getElementById('preloader-video');
  var value = document.getElementById('preloader-value');
  var finished = false;
  function tick(){
    if (finished) return;
    if (video.duration){
      value.textContent = Math.min(100, Math.round(video.currentTime / video.duration * 100));
    }
    requestAnimationFrame(tick);
  }
  function finish(){
    if (finished) return;
    finished = true;
    value.textContent = '100';
    var count = document.getElementById('preloader-count');
    var logo = document.getElementById('floating-logo');
    count.classList.add('is-leaving');
    logo.classList.add('is-docked');
    document.getElementById('preloader').classList.add('is-background');
    document.body.classList.add('preload-complete');
    startExperience();
    setTimeout(function(){ count.remove(); }, 750);
    setTimeout(function(){ logo.classList.add('is-settled'); }, 2000);
  }
  video.addEventListener('ended', finish);
  video.addEventListener('error', finish);
  function begin(){
    video.playbackRate = video.duration ? Math.max(.25, video.duration / 3) : 1;
    var p = video.play();
    if (p && p.catch) p.catch(finish);
    requestAnimationFrame(tick);
  }
  if (video.readyState >= 1) begin();
  else video.addEventListener('loadedmetadata', begin, { once:true });
}


async function travel(){
  var state = states[current];
  if (busy || !state.next || !state.portal) return;
  busy = true;
  targetX = 0; targetY = 0;
  var next = state.next.toLowerCase();
  var pm = state.portal;
  try {
    experience.classList.add('is-loading');
    if (pm.type === 'video'){
      transitionVideo.src = pm.src;
      transitionVideo.load();
      await Promise.race([
        waitEvent(transitionVideo, 'canplaythrough', 1600),
        waitEvent(transitionVideo, 'error', 1600)
      ]);
    }
    transitionMedia = pm.type === 'video' ? transitionVideo
                    : pm.type === 'image' ? portalImage
                    : sceneCanvasFor(pm.key);
    experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
    experience.classList.add('is-transitioning');
    canvasOpacity = 1;
    transitionActive = true;
    if (pm.type === 'video'){
      transitionVideo.currentTime = 0;
      transitionVideo.playbackRate = 1.3;
      await transitionVideo.play();
      await animateValue(function(v){ expansion = v; }, 1100);
      await waitEvent(transitionVideo, 'ended', 30000);
    } else {
      await animateValue(function(v){ expansion = v; }, 1100);
      await new Promise(function(r){ setTimeout(r, 600); });
    }
    sctx.clearRect(0, 0, innerWidth, innerHeight);
    drawCover(sctx, transitionMedia);
    frozen = true;
    current = next;
    experience.classList.add('is-committing');
    render();
    await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
    transitionActive = false;
    expansion = 0;
    maskScale = 0;
    canvasOpacity = 1;
    experience.classList.remove('is-transitioning', 'is-committing');
    var maskReveal = revealMask();
    setTimeout(revealPlanetContent, 100);
    await maskReveal;
    setTimeout(function(){
      if (pm.type === 'video'){
        transitionVideo.removeAttribute('src');
        transitionVideo.load();
      }
      frozen = false;
      busy = false;
    }, 450);
  } catch (err) {
    transitionActive = false;
    expansion = 0;
    maskScale = 1;
    canvasOpacity = 1;
    frozen = false;
    experience.classList.remove('is-transitioning', 'is-committing', 'is-loading');
    busy = false;
  }
}


var cursor = document.querySelector('.custom-cursor');
var cursorX = innerWidth / 2, cursorY = innerHeight / 2;
var orbitX = cursorX, orbitY = cursorY;
var cursorSeen = false;

document.addEventListener('pointermove', function(ev){
  cursorX = ev.clientX;
  cursorY = ev.clientY;
  if (!cursorSeen){
    cursorSeen = true;
    cursor.classList.add('is-visible');
  }
  if (busy) return;
  targetY = (ev.clientX / innerWidth - .5) * 37.4;
  targetX = (ev.clientY / innerHeight - .5) * -33;
});
document.addEventListener('pointerleave', function(){
  targetX = 0; targetY = 0;
});
document.addEventListener('mouseleave', function(){
  cursor.classList.remove('is-visible');
  cursorSeen = false;
});
portal.addEventListener('pointerenter', function(){ cursor.classList.add('is-enter'); });
portal.addEventListener('pointerleave', function(){ cursor.classList.remove('is-enter'); });
portal.addEventListener('click', travel);

function cursorLoop(){
  requestAnimationFrame(cursorLoop);
  orbitX += (cursorX - orbitX) * .2;
  orbitY += (cursorY - orbitY) * .2;
  cursor.style.transform = 'translate3d(' + orbitX + 'px,' + orbitY + 'px,0)';
}

window.addEventListener('resize', resizeCanvas);

var backgroundVideos = document.querySelectorAll('video.background');
for (var i = 0; i < backgroundVideos.length; i++){
  backgroundVideos[i].pause();
  backgroundVideos[i].currentTime = 0;
}
resizeCanvas();
render();
requestAnimationFrame(draw);
requestAnimationFrame(cursorLoop);
runPreloader();
})();

</script>
</body>
</html>
